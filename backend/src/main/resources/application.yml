server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: student
  jpa:
    hibernate.ddl-auto: update
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      schema: ${SPRING_DATASOURCE_SCHEMA:students_schema}
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS students_schema;
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:10000}

app:
  security:
    jwt-secret: ${JWT_SECRET}
  seed:
    superadmin-password: ${SEED_SUPERADMIN_PASSWORD}
    admin-password: ${SEED_ADMIN_PASSWORD}
    teacher-password: ${SEED_TEACHER_PASSWORD}
