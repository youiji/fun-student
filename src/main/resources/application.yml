server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    allow-circular-references: true
  application:
    name: student
  jpa:
    hibernate.ddl-auto: update
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/students_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      schema: ${SPRING_DATASOURCE_SCHEMA:students_schema}
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS students_schema;
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:10000}
